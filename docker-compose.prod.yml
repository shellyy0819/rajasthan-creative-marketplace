# Production backend stack on a hosted Postgres (Neon): migrate (one-shot) -> api.
# Usage: cp .env.backend.example .env.backend, then `npm run docker:up`.
services:
  migrate:
    build: { context: ., target: tooling }
    image: rr-tooling
    environment:
      # Migrations should use the DIRECT (non-pooler) Neon URL; falls back to DATABASE_URL.
      DATABASE_URL: ${MIGRATE_DATABASE_URL:-${DATABASE_URL:?set DATABASE_URL in .env.backend}}
    restart: "no"

  api:
    build: { context: ., target: runner }
    image: rr-api
    depends_on:
      migrate: { condition: service_completed_successfully }
    env_file: .env.backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.backend}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env.backend}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3000"
    restart: unless-stopped
    stop_grace_period: 20s
