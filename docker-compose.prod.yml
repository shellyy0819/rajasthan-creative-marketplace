# Production backend stack: db -> migrate (one-shot) -> api.
# Usage: cp .env.backend.example .env.backend, then `npm run docker:up`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rr
      POSTGRES_DB: rajasthan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.backend}
    volumes:
      - rr_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rr -d rajasthan"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., target: tooling }
    image: rr-tooling
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://rr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.backend}@db:5432/rajasthan
    restart: "no"

  api:
    build: { context: ., target: runner }
    image: rr-api
    depends_on:
      migrate: { condition: service_completed_successfully }
    env_file: .env.backend
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env.backend}
      DATABASE_URL: postgres://rr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.backend}@db:5432/rajasthan
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3000"
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  rr_pgdata_prod:
